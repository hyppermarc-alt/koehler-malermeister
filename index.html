<style>
:root{--paper:#F5F1EA;--ink:#1B1916;--ink-2:#4B463F;--red:#C8161D;--red-ink:#A31117;--line:rgba(27,25,22,.18)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:24px 16px;-webkit-font-smoothing:antialiased}
.card{width:100%;max-width:360px;text-align:center}
.brand{display:inline-flex;align-items:center;gap:12px;margin-bottom:44px}
.mark{width:26px;height:7px;background:var(--red);border-radius:1px;margin-top:10px}
.word{display:flex;flex-direction:column;text-align:left;line-height:1}
.word small{font-size:10px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-2);margin:0 0 4px 1px}
.word b{font-size:26px;font-weight:800;line-height:.9;color:var(--red);letter-spacing:.015em}
h1{font:italic 400 38px/1.05 Georgia,"Times New Roman",serif;margin:0 0 10px;letter-spacing:-.01em}
.sub{color:var(--ink-2);margin:0 0 28px;font-size:15px}
form{display:flex;flex-direction:column;gap:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
input{font:inherit;font-size:16px;padding:15px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none;text-align:center;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--ink);box-shadow:0 0 0 4px rgba(200,22,29,.12)}
button{font:inherit;font-weight:600;font-size:15.5px;padding:16px;border:0;border-radius:999px;background:var(--red);color:#fff;cursor:pointer;transition:background .2s}
button:hover{background:var(--red-ink)}
button:disabled{opacity:.65;cursor:progress}
.err{color:var(--red);font-size:14px;font-weight:500;min-height:21px;margin:6px 0 0}
.foot{margin-top:40px;font-size:12.5px;color:#8C8478}
</style>
</head>

<main class="card">
  <div class="brand" aria-label="Malermeister Köhler"><span class="mark"></span><span class="word"><small>Malermeister</small><b>KÖHLER</b></span></div>
  <h1>Website-Vorschau</h1>
  <p class="sub">Dieser Entwurf ist passwortgeschützt.</p>
  <form id="gate">

    <button id="go" type="submit">Vorschau öffnen</button>
    <p class="err" id="err" role="alert"></p>
  </form>
  <p class="foot">Vertraulicher Entwurf – bitte nicht weitergeben.</p>
</main>

<script>
(function(){
  var P = JSON.parse(document.getElementById('payload').textContent);
  var STORE = 'koehler-preview-key';
  function fromB64(s){ var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function toB64(buf){ var u = new Uint8Array(buf), s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }

  function derive(pw){
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function(base){
      return crypto.subtle.deriveKey({name:'PBKDF2', salt:fromB64(P.s), iterations:P.n, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, true, ['decrypt']);
    });
  }
  function decrypt(key){
    return crypto.subtle.decrypt({name:'AES-GCM', iv:fromB64(P.i)}, key, fromB64(P.d)).then(function(buf){ return new TextDecoder().decode(buf); });
  }
  function show(html){ document.open(); document.write(html); document.close(); }

  var form = document.getElementById('gate'), pw = document.getElementById('pw'), go = document.getElementById('go'), err = document.getElementById('err');

  if (!window.crypto || !crypto.subtle) {
    err.textContent = 'Bitte die Seite über https:// mit einem aktuellen Browser öffnen.';
    go.disabled = true;
    return;
  }

  // Within the same browser tab, skip the password after the first unlock.
  var saved = null;
  try { saved = sessionStorage.getItem(STORE); } catch (e) {}
  if (saved) {
    crypto.subtle.importKey('raw', fromB64(saved), 'AES-GCM', true, ['decrypt']).then(decrypt).then(show).catch(function(){
      try { sessionStorage.removeItem(STORE); } catch (e) {}
    });
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    err.textContent = '';
    go.disabled = true; go.textContent = 'Wird geöffnet …';
    var key;
    derive(pw.value).then(function(k){ key = k; return decrypt(k); }).then(function(html){
      return crypto.subtle.exportKey('raw', key).then(function(raw){
        try { sessionStorage.setItem(STORE, toB64(raw)); } catch (e) {}
        show(html);
      });
    }).catch(function(){
      err.textContent = 'Falsches Passwort. Bitte erneut versuchen.';
      go.disabled = false; go.textContent = 'Vorschau öffnen';
      pw.select();
    });
  });
})();
</script>
