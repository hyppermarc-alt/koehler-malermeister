<style>
:root{--paper:#F5F1EA;--ink:#1B1916;--ink-2:#4B463F;--red:#C8161D;--red-ink:#A31117;--line:rgba(27,25,22,.18)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:24px 16px;-webkit-font-smoothing:antialiased}
.card{width:100%;max-width:360px;text-align:center}
.brand{display:inline-flex;align-items:center;gap:14px;margin-bottom:44px}
.mark{width:34px;height:9px;background:var(--red);border-radius:1px;margin-top:14px}
.word{display:flex;flex-direction:column;text-align:left;line-height:1}
.word small{font-size:12px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-2);margin:0 0 4px 1px}
.word b{font-size:35px;font-weight:800;line-height:.9;color:var(--red);letter-spacing:.015em}
h1{font:italic 400 38px/1.05 Georgia,"Times New Roman",serif;margin:0 0 10px;letter-spacing:-.01em}
.sub{color:var(--ink-2);margin:0 0 28px;font-size:15px}
form{display:flex;flex-direction:column;gap:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
input{font:inherit;font-size:16px;padding:15px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none;text-align:center;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--ink);box-shadow:0 0 0 4px rgba(200,22,29,.12)}
button{font:inherit;font-weight:600;font-size:15.5px;padding:16px;border:0;border-radius:999px;background:var(--red);color:#fff;cursor:pointer;transition:background .2s}
button:hover{background:var(--red-ink)}
button:disabled{opacity:.65;cursor:progress}
.err{color:var(--red);font-size:14px;font-weight:500;min-height:21px;margin:6px 0 0}
.foot{margin-top:40px;font-size:12.5px;color:#8C8478}
</style>
</head>
<body>
<main class="card">
  <div class="brand" aria-label="Malermeister Köhler"><span class="mark"></span><span class="word"><small>Malermeister</small><b>KÖHLER</b></span></div>
  <h1>Website-Vorschau</h1>
  <p class="sub">Dieser Entwurf ist passwortgeschützt.</p>
  <form id="gate">
    <label class="sr" for="pw">Passwort</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Passwort" required autofocus>
    <button id="go" type="submit">Vorschau öffnen</button>
    <p class="err" id="err" role="alert"></p>
  </form>
  <p class="foot">Vertraulicher Entwurf – bitte nicht weitergeben.</p>
</main>

    err.textContent = '';
    go.disabled = true; go.textContent = 'Wird geöffnet …';
    var key;
    derive(pw.value).then(function(k){ key = k; return decrypt(k); }).then(function(html){
      return crypto.subtle.exportKey('raw', key).then(function(raw){
        try { sessionStorage.setItem(STORE, toB64(raw)); } catch (e) {}
        show(html);
      });
    }).catch(function(){
      err.textContent = 'Falsches Passwort. Bitte erneut versuchen.';
      go.disabled = false; go.textContent = 'Vorschau öffnen';
      pw.select();
    });
  });
})();
</script>
</body>
</html>
